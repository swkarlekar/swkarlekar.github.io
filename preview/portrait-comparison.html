<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <title>Portrait comparison · Sweta Karlekar</title>
  <link rel="icon" href="../images/optimized/favicon-64.png">
  <link rel="stylesheet" href="../assets/css/academic.css">
  <link rel="stylesheet" href="portrait-comparison.css">
</head>
<body>
  <main class="comparison-page">
    <header class="comparison-heading">
      <a class="comparison-back" href="../">Back to website</a>
      <h1>Portrait comparison</h1>
      <p>Compare both crops at the same width, then see each one on the homepage.</p>
    </header>
    <div class="comparison-grid">
      <section class="comparison-card" aria-labelledby="codex-crop-title">
        <h2 id="codex-crop-title">Codex crop</h2>
        <div class="portrait-wrap">
          <picture>
            <source type="image/webp" srcset="portrait-codex-480.webp 480w, portrait-codex-960.webp 960w" sizes="261px">
            <img class="portrait" src="portrait-codex-480.jpg" srcset="portrait-codex-480.jpg 480w, portrait-codex-960.jpg 960w" sizes="261px" width="480" height="624" alt="Sweta Karlekar in front of a classical sculpture and arch, using the Codex crop.">
          </picture>
        </div>
        <a class="button" href="homepage-codex-crop.html">View on homepage</a>
      </section>
      <section class="comparison-card" aria-labelledby="your-crop-title">
        <h2 id="your-crop-title">Your crop</h2>
        <div class="portrait-wrap">
          <picture>
            <source type="image/webp" srcset="portrait-user-480.webp 480w, portrait-user-960.webp 960w" sizes="261px">
            <img class="portrait" src="portrait-user-480.jpg" srcset="portrait-user-480.jpg 480w, portrait-user-960.jpg 960w" sizes="261px" width="480" height="651" alt="Sweta Karlekar in front of a classical sculpture and arch, using your uploaded crop.">
          </picture>
        </div>
        <a class="button" href="homepage-your-crop.html">View on homepage</a>
      </section>
    </div>
  </main>
</body>
</html>
